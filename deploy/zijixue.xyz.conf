# /etc/nginx/conf.d/zijixue.xyz.conf
#
# 家庭学习助手（project2 / English Forest）正式域名：zijixue.xyz
# 2026-11-20 起从「sunxinshan.site/zijixue 子路径」迁移到「独立域名根路径」。
#   前端构建 base = /（VITE_BASE_PATH=/），接口 = /api/v1。
#   上游：127.0.0.1:8003 静态 SPA（deploy/serve_spa.py）、127.0.0.1:8002 FastAPI。
#
# 证书由 certbot webroot 签发（见 deploy/migrate-zijixue-root.sh），
# 独立一张，不与 sunxinshan.site 混签：一个域名下线不用重签另一个。

upstream zijixue_api {
    server 127.0.0.1:8002;
    keepalive 16;
}

upstream zijixue_web {
    server 127.0.0.1:8003;
    keepalive 16;
}

# ---------- 80：只放行 ACME 校验，其余跳 https ----------
server {
    listen 80;
    listen [::]:80;
    server_name zijixue.xyz www.zijixue.xyz;

    # 必须写在 location 里，否则 server 级 return 会先返回 301，校验文件取不到。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://zijixue.xyz$request_uri;
    }
}

# ---------- 443：www 统一到裸域名 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.zijixue.xyz;

    ssl_certificate     /etc/letsencrypt/live/zijixue.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zijixue.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://zijixue.xyz$request_uri;
}

# ---------- 443：正式站点 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zijixue.xyz;

    ssl_certificate     /etc/letsencrypt/live/zijixue.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zijixue.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # 接口：/api/v1/... → 后端 /api/v1/...
    # Agent 回复是 SSE 流式，proxy_buffering 必须关掉，否则攒够才发。
    location ^~ /api/ {
        proxy_pass http://zijixue_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 静态资源与 SPA 路由：原样透传，兜底 index.html 由 serve_spa.py 处理。
    location / {
        proxy_pass http://zijixue_web/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
    }
}
