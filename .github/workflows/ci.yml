name: CI

on:
  push:
  pull_request:

jobs:
  backend-sqlite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run alembic upgrade head

  backend-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
          MYSQL_DATABASE: familylearning_test
          MYSQL_USER: fla
          MYSQL_PASSWORD: fla-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-test-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
          --character-set-server=utf8mb4
          --collation-server=utf8mb4_0900_ai_ci
    defaults:
      run:
        working-directory: backend
    env:
      FLA_TEST_DATABASE_URL: mysql+pymysql://fla:fla-test-password@127.0.0.1:3306/familylearning_test?charset=utf8mb4
      FLA_TEST_CHECKPOINT_BACKEND: mysql
      FLA_TEST_CHECKPOINT_URL: mysql://fla:fla-test-password@127.0.0.1:3306/familylearning_checkpoints?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Create checkpoint and migration databases
        run: |
          mysql -h127.0.0.1 -uroot -proot-test-password -e "
            CREATE DATABASE familylearning_checkpoints CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
            CREATE DATABASE familylearning_migration CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
            GRANT ALL PRIVILEGES ON familylearning_checkpoints.* TO 'fla'@'%';
            GRANT ALL PRIVILEGES ON familylearning_migration.* TO 'fla'@'%';
            FLUSH PRIVILEGES;"
      - run: uv sync --dev
      - run: uv run pytest
      - name: Verify all migrations on an empty MySQL database
        env:
          FLA_DATABASE_URL: mysql+pymysql://fla:fla-test-password@127.0.0.1:3306/familylearning_migration?charset=utf8mb4
        run: uv run alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Prepare backend for E2E
        run: |
          cd ../backend
          uv sync --dev
          uv run alembic upgrade head
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
